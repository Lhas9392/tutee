  <main class="form-page">
    <div class="form-wrap">
      <h1>Sign Up</h1>
      <p class="section-intro">Create your free student account to start booking tutors.</p>
      <form class="form">
        <div class="form-row">
          <div class="field">
            <label for="first">First name</label>
            <input type="text" id="first" name="first-name" required>
          </div>
          <div class="field">
            <label for="last">Last name</label>
            <input type="text" id="last" name="last-name" required>
          </div>
        </div>
        <div class="field">
          <label for="email">VSU email</label>
          <input type="email" id="email" name="email" placeholder="you@students.vsu.edu" required>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="year">Classification</label>
            <select id="year" name="classification" required>
              <option value="">Select one</option>
              <option>Freshman</option>
              <option>Sophomore</option>
              <option>Junior</option>
              <option>Senior</option>
              <option>Graduate</option>
            </select>
          </div>
          <div class="field">
            <label for="major">Major</label>
            <input type="text" id="major" name="major" placeholder="e.g. Computer Science">
          </div>
        </div>
        <div class="field">
          <label for="course">Course you need help with</label>
          <input type="text" id="course" name="course" placeholder="e.g. MATH 150, CSCI 250">
        </div>
        <div class="form-row">
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm-password" minlength="8" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create account</button>
        <p class="form-note">Already have an account? <a href="sign-in.html">Sign in</a></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
