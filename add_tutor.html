<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Tutor</title>
</head>
<body>
    <h1>Enter Tutor Information</h1>

    <form action="add_tutor.php" method="POST">
        <label>Tutor ID: </label><br>
        <input type="text" name="trId" required minlength="6" maxlength="6"><br><br>

        <label>First Name: </label><br>
        <input type="text" name="trFname" required minlength="1" maxlength="100"><br><br>

        <label>Last Name: </label><br>
        <input type="text" name="trLname" required minlength="1" maxlength="100"><br><br>

        <label>Email: </label><br>
        <input type="email" name="trEmail" required minlength="10" maxlength="100"><br><br>

        <label>Area of Expertise: </label><br>
        <select name="trExpert" required>
            <option value="Undecided">Undecided</option>
            <option value="Agriculture">Agriculture</option>
            <option value="Mass Commmunications">Mass Commmunications</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Elementary Education">Elementary Education</option>
            <option value="Special Education">Special Education</option>
            <option value="Innovative Technology Education">Innovative Technology Education</option>
            <option value="Health and Physical Education">Health and Physical Education</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Family and Consumer Sciences">Family and Consumer Sciences</option>
            <option value="English">English</option>
            <option value="Interdisciplinary Studies">Interdisciplinary Studies</option>
            <option value="Biology">Biology</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Psychology">Psychology</option>
            <option value="Criminal Justice">Criminal Justice</option>
            <option value="Social Work" >Social Work</option>
        </select><br><br>

        <label>Years of Experience: </label><br>
        <input type="number" name="trYears" required min="1" max="999"><br><br>

        <input type="submit" value="Become Tutor">


    </form>
    
</body>
</html>
